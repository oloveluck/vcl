# Builds the Scribble documentation and publishes it to GitHub Pages.
# The family's packages are not on pkgs.racket-lang.org yet, so the ones this
# package builds on are installed from their GitHub repositories first.
name: docs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: stable
          variant: CS
          distribution: full
      - name: Install the packages (this repository's and the family packages it builds on, in one command)
        run: |
          raco pkg install --no-docs --batch --auto \
            "$PWD" \
            "https://github.com/oloveluck/fhir.git?path=fhir" \
            "https://github.com/oloveluck/fhir.git?path=fhir-spec"
      - name: The spec's examples (parse and fixpoint) and the module tests
        run: raco test tests/parse-test.rkt compile.rkt decompile.rkt parser/parse.rkt base.rkt
      - name: Build the documentation
        run: |
          raco scribble +m --html --dest site --dest-name index.html --redirect-main https://docs.racket-lang.org/ scribblings/vcl.scrbl
      # Publish: the built site goes to the gh-pages branch, which GitHub serves as the Pages site
      # (enabled automatically for a public repository; otherwise choose "Deploy from a branch:
      # gh-pages" once under Settings > Pages).
      - name: Publish to GitHub Pages
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "docs for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
